<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Просмотр трансляции</title>
    <!-- Отключаем масштабирование пользователем для эффекта нативного приложения -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            height: 100dvh; /* Для современных мобильных браузеров */
            overflow: hidden;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* По умолчанию с рамками, чтобы видеть весь экран */
            transform: translateZ(0); /* Включаем аппаратное ускорение для снижения задержки */
            will-change: transform;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        button {
            padding: 18px 36px;
            font-size: 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h2 id="statusText">Ожидание трансляции...</h2>
        <button id="playBtn" style="display:none;">Смотреть (Полный экран)</button>
        <div class="hint" id="hintText" style="display:none;">Дважды тапните по видео, чтобы убрать черные рамки (обрезать края)</div>
    </div>
    
    <video id="video" playsinline autoplay disablePictureInPicture></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');
        const hintText = document.getElementById('hintText');
        
        let peerConnection;
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        // Функция для перехода в полноэкранный режим
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // Двойной тап для переключения режима заполнения (с рамками / без рамок)
        let lastTap = 0;
        video.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 500 && tapLength > 0) {
                // Двойной тап
                if (video.style.objectFit === 'cover') {
                    video.style.objectFit = 'contain';
                } else {
                    video.style.objectFit = 'cover';
                }
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        // Также добавим двойной клик для мыши (если открыто на ПК/планшете)
        video.addEventListener('dblclick', () => {
            if (video.style.objectFit === 'cover') {
                video.style.objectFit = 'contain';
            } else {
                video.style.objectFit = 'cover';
            }
        });

        playBtn.onclick = async () => {
            try {
                await video.play();
                enterFullscreen();
                overlay.style.display = 'none';
            } catch (err) {
                console.error("Ошибка воспроизведения:", err);
            }
        };

        socket.on('connect', () => {
            socket.emit('watcher');
        });

        socket.on('broadcaster', () => {
            socket.emit('watcher');
        });

        socket.on('offer', (id, description) => {
            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.setRemoteDescription(description)
                .then(() => peerConnection.createAnswer())
                .then(sdp => peerConnection.setLocalDescription(sdp))
                .then(() => {
                    socket.emit('answer', id, peerConnection.localDescription);
                });

            peerConnection.ontrack = event => {
                video.srcObject = event.streams[0];
                
                statusText.innerText = 'Трансляция готова!';
                playBtn.style.display = 'block';
                hintText.style.display = 'block';
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('candidate', id, event.candidate);
                }
            };
        });

        socket.on('candidate', (id, candidate) => {
            peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
                .catch(e => console.error(e));
        });

        socket.on('disconnect', () => {
            overlay.style.display = 'flex';
            statusText.innerText = 'Соединение потеряно';
            playBtn.style.display = 'none';
            hintText.style.display = 'none';
            if (peerConnection) {
                peerConnection.close();
            }
            // Выход из полноэкранного режима при отключении
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
